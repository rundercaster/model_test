<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METROVALE — open city</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Inter:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070c; font-family:Inter,system-ui,sans-serif; }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }

  #brand { position:absolute; top:26px; left:30px; opacity:0; animation:fade .9s .3s forwards; }
  #brand .name {
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:34px;
    letter-spacing:.34em; color:rgba(255,255,255,.94); line-height:1;
    text-shadow:0 2px 18px rgba(0,0,0,.55);
  }
  #brand .sub {
    font-family:'Barlow Condensed',sans-serif; font-weight:500; font-size:12.5px;
    letter-spacing:.52em; color:#ffb545; margin-top:7px; text-transform:uppercase;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  #brand .line { width:54px; height:2px; background:linear-gradient(90deg,#ffb545,transparent); margin-top:10px; }

  #clockBox { position:absolute; top:28px; right:32px; text-align:right; opacity:0; animation:fade .9s .5s forwards; }
  #clock { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:40px; letter-spacing:.06em;
           color:rgba(255,255,255,.95); line-height:1; text-shadow:0 2px 18px rgba(0,0,0,.6); }
  #phase { font-family:'Barlow Condensed',sans-serif; font-size:12.5px; letter-spacing:.42em; color:#ffb545;
           margin-top:6px; text-transform:uppercase; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  #speedo { font-size:11px; letter-spacing:.28em; color:rgba(255,255,255,.55); margin-top:9px; text-transform:uppercase; }

  #controls {
    position:absolute; left:30px; bottom:26px; display:flex; gap:22px;
    opacity:0; animation:fade 1s 1.1s forwards;
  }
  .ctl { display:flex; align-items:center; gap:9px; }
  .key {
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; letter-spacing:.08em;
    color:rgba(255,255,255,.92); background:rgba(12,16,24,.42); border:1px solid rgba(255,255,255,.22);
    border-bottom-width:2px; border-radius:5px; padding:3px 8px 2px; backdrop-filter:blur(6px);
    min-width:26px; text-align:center;
  }
  .lbl { font-size:11px; letter-spacing:.2em; color:rgba(255,255,255,.5); text-transform:uppercase; }

  #vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.42) 100%); }
  #fade { position:fixed; inset:0; background:#05070c; pointer-events:none; opacity:1;
    animation:blackout 2.4s .2s forwards; }

  #hint {
    position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
    font-size:12px; letter-spacing:.3em; color:rgba(255,255,255,.75); text-transform:uppercase;
    background:rgba(10,14,20,.45); border:1px solid rgba(255,255,255,.14); border-radius:30px;
    padding:9px 22px; backdrop-filter:blur(8px); opacity:0; animation:hintCycle 9s 2s forwards;
  }
  @keyframes hintCycle {
    0%{opacity:0;transform:translateX(-50%) translateY(10px)}
    8%{opacity:1;transform:translateX(-50%) translateY(0)}
    85%{opacity:1;transform:translateX(-50%) translateY(0)}
    100%{opacity:0;transform:translateX(-50%) translateY(6px)}
  }
  @keyframes fade { to { opacity:1; } }
  @keyframes blackout { to { opacity:0; } }

  #pause {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(4,6,10,.55); backdrop-filter:blur(5px); pointer-events:none; z-index:5;
  }
  #pause .box { text-align:center; }
  #pause .t1 { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:56px;
    letter-spacing:.4em; color:#fff; text-shadow:0 4px 30px rgba(0,0,0,.7); }
  #pause .t2 { font-size:12.5px; letter-spacing:.4em; color:#ffb545; margin-top:14px; text-transform:uppercase; }
</style>
</head>
<body>
<div id="hud">
  <div id="brand">
    <div class="name">METROVALE</div>
    <div class="sub">Open City &mdash; District One</div>
    <div class="line"></div>
  </div>
  <div id="clockBox">
    <div id="clock">07:30</div>
    <div id="phase">Morning</div>
    <div id="speedo">Idle</div>
  </div>
  <div id="controls">
    <div class="ctl"><span class="key">W A S D</span><span class="lbl">Move</span></div>
    <div class="ctl"><span class="key">Mouse</span><span class="lbl">Look</span></div>
    <div class="ctl"><span class="key">Shift</span><span class="lbl">Sprint</span></div>
    <div class="ctl"><span class="key">Click</span><span class="lbl">Capture</span></div>
  </div>
  <div id="hint">Click anywhere to capture the mouse</div>
</div>
<div id="vignette"></div>
<div id="pause"><div class="box"><div class="t1">PAUSED</div><div class="t2">Click to resume</div></div></div>
<div id="fade"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* wait for webfonts so canvas signage uses the intended typeface */
if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) {
  try { await document.fonts.ready; } catch(e) {}
}

/* ============================== CONSTANTS ============================== */
const BLOCK = 46, ROAD_W = 14, N = 9;          // 9x9 blocks
const PITCH = BLOCK + ROAD_W;                   // 60
const HALF = (N * PITCH) / 2;                   // 270
const WORLD = HALF * 2;
const SIDEW = 3.6;
const CAR_COUNT = 30, PED_COUNT = 46;
const DAY_LENGTH = 300;                         // seconds per 24h cycle
const CAR_COLORS = [0xd94f3d,0x2f6fdb,0xe8e6e1,0x1c1f24,0xd7a523,0x3f9d6b,0x8e44ad,0xc0c6cc,0x2a9d8f,0xe76f51];

/* ============================== UTILITIES ============================== */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
function lerpC(o,a,b,t){ o.setHex(a); const c=new THREE.Color(b); o.lerp(c,t); return o; }
function mulberry32(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rng = mulberry32(20240617);
const R  = (a,b)=> a + rng()*(b-a);
const RI = (a,b)=> Math.floor(R(a,b+1));
const pick = arr => arr[Math.floor(rng()*arr.length)];

/* ============================== RENDERER ============================== */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fb4c9, 90, 620);

const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 60, 200);

/* ============================== PROCEDURAL TEXTURES ============================== */
function cnv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(c, srgb=true, rep=true){
  const t = new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  if(rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function speckle(ctx,w,h,n,cols,a){
  for(let i=0;i<n;i++){ ctx.fillStyle = cols[(rng()*cols.length)|0];
    ctx.globalAlpha = a*(0.4+rng()*0.6); const s=1+rng()*3;
    ctx.fillRect(rng()*w, rng()*h, s, s); }
  ctx.globalAlpha = 1;
}

/* --- Asphalt --- */
function makeRoadTex(){
  const c = cnv(512,512), x = c.getContext('2d');
  x.fillStyle = '#26292e'; x.fillRect(0,0,512,512);
  speckle(x,512,512,9000,['#1d2024','#2e3238','#33373d','#202327'],0.55);
  // patches & seams
  for(let i=0;i<7;i++){ x.globalAlpha=0.10; x.fillStyle='#15171a';
    x.fillRect(R(0,400),R(0,400),R(40,140),R(30,110)); }
  x.globalAlpha=1;
  x.strokeStyle='rgba(10,11,13,0.5)'; x.lineWidth=2;
  for(let i=0;i<4;i++){ x.beginPath(); const y=R(0,512); x.moveTo(0,y);
    x.bezierCurveTo(170,y+R(-30,30),340,y+R(-30,30),512,y+R(-20,20)); x.stroke(); }
  return tex(c);
}

/* --- Sidewalk --- */
function makeSidewalkTex(){
  const c = cnv(256,256), x = c.getContext('2d');
  x.fillStyle='#a6a6a1'; x.fillRect(0,0,256,256);
  speckle(x,256,256,4000,['#9a9a95','#b0b0ab','#8f8f8a','#b8b8b3'],0.5);
  x.strokeStyle='rgba(70,70,68,0.55)'; x.lineWidth=2;
  for(let i=0;i<=2;i++){ const p=i*128;
    x.beginPath(); x.moveTo(p,0); x.lineTo(p,256); x.stroke();
    x.beginPath(); x.moveTo(0,p); x.lineTo(256,p); x.stroke(); }
  x.strokeStyle='rgba(60,60,58,0.35)'; x.lineWidth=4;
  x.strokeRect(1,1,254,254);
  return tex(c);
}

/* --- Grass / park --- */
function makeGrassTex(){
  const c = cnv(256,256), x=c.getContext('2d');
  x.fillStyle='#4f7a3c'; x.fillRect(0,0,256,256);
  for(let i=0;i<6000;i++){ const g=RI(0,2);
    x.fillStyle=['#456e34','#598a44','#3d6330','#638f4b'][g];
    x.globalAlpha=0.5; x.fillRect(rng()*256,rng()*256,2,3); }
  x.globalAlpha=1;
  return tex(c);
}

/* --- Facade: vertical ribbed concrete --- */
function makeFacadeRibbed(base, glass){
  const w=256,h=512,c=cnv(w,h),x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,w,h);
  speckle(x,w,h,2500,['rgba(0,0,0,0.06)','rgba(255,255,255,0.05)'],0.5);
  const cols=8, cw=w/cols;
  for(let r=0;r<16;r++){
    for(let i=0;i<cols;i++){
      const lit = rng()<0.55;
      const y = 14 + r*31;
      x.fillStyle = lit ? glass : 'rgba(10,14,20,0.72)';
      x.fillRect(i*cw+5, y, cw-10, 19);
      if(lit && rng()<0.35){ x.fillStyle='rgba(255,255,255,0.25)';
        x.fillRect(i*cw+5, y, cw-10, 5); }
    }
  }
  // floor slabs
  x.fillStyle='rgba(0,0,0,0.16)';
  for(let r=0;r<=16;r++) x.fillRect(0, r*31+5, w, 3);
  return tex(c);
}

/* --- Facade: brick with punched windows --- */
function makeFacadeBrick(base){
  const w=256,h=512,c=cnv(w,h),x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,w,h);
  // brick pattern
  x.strokeStyle='rgba(0,0,0,0.14)'; x.lineWidth=1;
  for(let y=0;y<h;y+=8){ x.beginPath(); x.moveTo(0,y); x.lineTo(w,y); x.stroke(); }
  for(let y=0;y<h;y+=8){ const off=(y/8)%2?16:0;
    for(let bx=off;bx<w;bx+=32){ x.beginPath(); x.moveTo(bx,y); x.lineTo(bx,y+8); x.stroke(); } }
  speckle(x,w,h,3000,['rgba(255,255,255,0.05)','rgba(0,0,0,0.07)'],0.5);
  // windows 5 cols x 7 rows
  const cols=5,cw=w/cols;
  for(let r=0;r<7;r++){
    for(let i=0;i<cols;i++){
      const wx=i*cw+9, wy=22+r*69, ww=cw-18, wh=44;
      x.fillStyle='rgba(0,0,0,0.28)'; x.fillRect(wx-3,wy-3,ww+6,wh+6);
      const lit = rng()<0.5;
      x.fillStyle = lit ? (rng()<0.5?'#ffd9a0':'#cfe2ff') : '#1a2029';
      x.fillRect(wx,wy,ww,wh);
      x.strokeStyle='rgba(240,240,240,0.5)'; x.lineWidth=2;
      x.strokeRect(wx,wy,ww,wh);
      x.beginPath(); x.moveTo(wx+ww/2,wy); x.lineTo(wx+ww/2,wy+wh); x.stroke();
      // sill
      x.fillStyle='rgba(255,255,255,0.22)'; x.fillRect(wx-3,wy+wh,ww+6,4);
      if(lit && rng()<0.3){ x.fillStyle='rgba(255,180,90,0.5)'; x.fillRect(wx,wy+wh-14,ww,14); }
    }
  }
  return tex(c);
}

/* --- Facade: modern glass tower --- */
function makeFacadeGlass(base, tint){
  const w=256,h=512,c=cnv(w,h),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,base); g.addColorStop(1,tint);
  x.fillStyle=g; x.fillRect(0,0,w,h);
  const cols=6, cw=w/cols;
  for(let r=0;r<16;r++){
    for(let i=0;i<cols;i++){
      const y=10+r*31, lit=rng()<0.45;
      x.fillStyle = lit ? (rng()<0.5?'rgba(255,235,190,0.95)':'rgba(190,220,255,0.9)')
                        : 'rgba(8,14,24,0.55)';
      x.fillRect(i*cw+4, y, cw-8, 23);
      x.fillStyle='rgba(255,255,255,0.10)';
      x.fillRect(i*cw+4, y, cw-8, 7);
    }
  }
  x.fillStyle='rgba(0,0,0,0.35)';
  for(let r=0;r<=16;r++) x.fillRect(0, r*31+6, w, 4);
  for(let i=0;i<=cols;i++) x.fillRect(i*cw-2, 0, 4, h);
  return tex(c);
}

/* --- Facade: storefront ground floor (used separately) --- */
const SHOP_SIGNS = ['CAFE','NOODLE','BARBER','RECORDS','MARKET','PIZZA','FLORIST','DINER','BOOKS','LAUNDRY','KIOSK','GYM'];
function makeShopTex(){
  const w=512,h=128,c=cnv(w,h),x=c.getContext('2d');
  const bays=4, bw=w/bays;
  for(let i=0;i<bays;i++){
    const ox=i*bw;
    // frame
    x.fillStyle='#1b1e24'; x.fillRect(ox,0,bw,h);
    // big glass
    const g=x.createLinearGradient(ox,0,ox,h);
    g.addColorStop(0,'#33414f'); g.addColorStop(1,'#1d2733');
    x.fillStyle=g; x.fillRect(ox+8,34,bw-16,h-42);
    x.fillStyle='rgba(255,255,255,0.10)'; x.fillRect(ox+8,34,bw-16,16);
    // sign band
    const hue = pick(['#e94f37','#ffb545','#4cc9f0','#f72585','#80ed99','#ffd166','#f8f9fa']);
    x.fillStyle='#0e1116'; x.fillRect(ox+6,4,bw-12,26);
    x.fillStyle=hue;
    x.font='700 17px "Barlow Condensed", sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText(pick(SHOP_SIGNS), ox+bw/2, 18);
    // warm interior glow
    x.fillStyle='rgba(255,200,120,0.35)'; x.fillRect(ox+14,h-40,bw-28,22);
    // mullion
    x.strokeStyle='rgba(200,215,230,0.5)'; x.lineWidth=3;
    x.strokeRect(ox+8,34,bw-16,h-42);
    x.beginPath(); x.moveTo(ox+bw/2,34); x.lineTo(ox+bw/2,h-8); x.stroke();
  }
  return tex(c);
}

/* --- Neon sign --- */
const NEON_WORDS = ['MOTEL','OPEN 24H','BAR','LIVE','SUSHI','CLUB','HOTEL','RAMEN','ARCADE','TATTOO'];
function makeNeonTex(word, color){
  const w=256,h=112,c=cnv(w,h),x=c.getContext('2d');
  x.fillStyle='rgba(6,8,12,0.9)'; x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(255,255,255,0.12)'; x.lineWidth=3; x.strokeRect(3,3,w-6,h-6);
  x.font='700 58px "Barlow Condensed", sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor=color; x.shadowBlur=26;
  x.fillStyle=color; x.fillText(word, w/2, h/2+2);
  x.shadowBlur=10; x.fillStyle='#ffffff'; x.font='700 54px "Barlow Condensed", sans-serif';
  x.globalAlpha=0.85; x.fillText(word, w/2, h/2+2);
  return tex(c);
}

/* --- Skyline silhouette billboard --- */
function makeSkylineTex(){
  const w=1024,h=256,c=cnv(w,h),x=c.getContext('2d');
  x.clearRect(0,0,w,h);
  x.fillStyle='#0e1420';
  let px=0;
  while(px<w){
    const bw=R(24,70), bh=R(50,230);
    x.fillRect(px, h-bh, bw, bh);
    if(rng()<0.3){ x.fillRect(px+bw/2-3, h-bh-18, 6, 18); } // antenna
    // windows
    for(let wy=h-bh+8; wy<h-8; wy+=12){
      for(let wx=px+5; wx<px+bw-6; wx+=10){
        if(rng()<0.30){ x.fillStyle= rng()<0.6?'rgba(255,214,140,0.75)':'rgba(170,205,255,0.6)';
          x.fillRect(wx,wy,5,7); x.fillStyle='#0e1420'; }
      }
    }
    px += bw + R(3,16);
  }
  return tex(c);
}

/* ============================== SKY ============================== */
const SKY_VS = `
varying vec3 vWorld;
void main(){ vWorld = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const SKY_FS = `
varying vec3 vWorld;
uniform vec3 uZenith, uHorizon, uSunDir, uSunColor;
uniform float uNight;
void main(){
  vec3 d = normalize(vWorld);
  float h = clamp(d.y, -1.0, 1.0);
  vec3 col = mix(uHorizon, uZenith, pow(max(h,0.0), 0.55));
  float sd = max(dot(d, normalize(uSunDir)), 0.0);
  col += uSunColor * (pow(sd, 260.0)*1.4 + pow(sd, 12.0)*0.30);
  // stars
  if(uNight > 0.02 && h > -0.02){
    vec3 p = d * 260.0;
    vec3 q = floor(p);
    vec3 f = fract(p) - 0.5;
    float rnd = fract(sin(dot(q, vec3(12.9898,78.233,45.164)))*43758.5453);
    float star = step(0.9955, rnd) * smoothstep(0.45, 0.05, length(f));
    float tw = 0.7 + 0.3*sin(rnd*90.0 + q.x);
    col += vec3(0.9,0.93,1.0) * star * tw * uNight * smoothstep(0.0,0.25,h);
  }
  gl_FragColor = vec4(col, 1.0);
}`;
const skyUniforms = {
  uZenith:{value:new THREE.Color(0x2f6db5)}, uHorizon:{value:new THREE.Color(0xbcd3e6)},
  uSunDir:{value:new THREE.Vector3(0,1,0)}, uSunColor:{value:new THREE.Color(0xffe0b0)},
  uNight:{value:0}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1500, 40, 24),
  new THREE.ShaderMaterial({ uniforms:skyUniforms, vertexShader:SKY_VS, fragmentShader:SKY_FS,
    side:THREE.BackSide, depthWrite:false, fog:false })
);
sky.renderOrder = -1;
scene.add(sky);

/* ============================== LIGHTS ============================== */
const hemi = new THREE.HemisphereLight(0xbfd6ff, 0x4a4640, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 420;
const S = 78;
sun.shadow.camera.left=-S; sun.shadow.camera.right=S;
sun.shadow.camera.top=S; sun.shadow.camera.bottom=-S;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ============================== GROUND & ROADS ============================== */
const groundTex = makeGrassTex(); groundTex.repeat.set(WORLD/6, WORLD/6);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD+600, WORLD+600),
  new THREE.MeshStandardMaterial({ map:groundTex, roughness:1, color:0x6e7a62 })
);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.06;
ground.receiveShadow = true;
scene.add(ground);

const roadTex = makeRoadTex(); roadTex.repeat.set(1,1);
const asphalt = new THREE.MeshStandardMaterial({ map:roadTex, roughness:0.94, color:0xffffff });
// road strips
{
  const roads = [];
  for(let i=0;i<=N;i++){
    const p = -HALF + i*PITCH;
    roads.push({x:0, z:p, w:WORLD, h:ROAD_W});
    roads.push({x:p, z:0, w:ROAD_W, h:WORLD});
  }
  const mats = roads.map(r=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.h), asphalt);
    m.rotation.x = -Math.PI/2; m.position.set(r.x, 0, r.z);
    m.receiveShadow = true; scene.add(m);
    return m;
  });
  // scale texture repeat per plane
  mats.forEach((m,i)=>{
    const r = roads[i];
    const t = roadTex.clone(); t.needsUpdate = true;
    t.repeat.set(Math.max(1, r.w/24), Math.max(1, r.h/24));
    m.material = asphalt.clone(); m.material.map = t;
  });
}

/* lane markings (slightly above road to avoid z-fight) */
{
  const dashMat = new THREE.MeshBasicMaterial({ color:0xe8e2c8 });
  const lineMat = new THREE.MeshBasicMaterial({ color:0xd8d3bd });
  const centers = [];
  for(let i=0;i<=N;i++) centers.push(-HALF + i*PITCH);

  const step = 8;
  const nH = Math.floor(WORLD/step), nV = nH;
  const dashH = new THREE.InstancedMesh(new THREE.PlaneGeometry(3.4, 0.34), dashMat, nH*centers.length);
  const dashV = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.34, 3.4), dashMat, nV*centers.length);
  const mtx = new THREE.Matrix4();
  const qF = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,0));
  const one = new THREE.Vector3(1,1,1);
  let ih=0, iv=0;
  for(const c of centers){
    for(let d=0; d<nH; d++){
      const t = -HALF + d*step + step/2;
      if(Math.abs(t - c) < ROAD_W*0.75) continue; // skip intersections
      mtx.compose(new THREE.Vector3(t, 0.02, c), qF, one);
      dashH.setMatrixAt(ih++, mtx);
      mtx.compose(new THREE.Vector3(c, 0.02, t), qF, one);
      dashV.setMatrixAt(iv++, mtx);
    }
  }
  dashH.count = ih; dashV.count = iv;
  dashH.instanceMatrix.needsUpdate = dashV.instanceMatrix.needsUpdate = true;
  dashH.frustumCulled = dashV.frustumCulled = false;
  scene.add(dashH, dashV);

  // solid edge lines — segmented so they don't cross intersections
  const edgeGeo = new THREE.PlaneGeometry(1, 1);
  const edgeSpans = [];
  for(let i=0;i<centers.length;i++){
    const lo = i === 0 ? -HALF : centers[i] + 10;
    const hi = i === centers.length-1 ? HALF : centers[i+1] - 10;
    if(hi - lo < 4) continue;
    edgeSpans.push({ mid:(lo+hi)/2, len:hi-lo, c:centers[i] });
  }
  const edgeInst = new THREE.InstancedMesh(edgeGeo, lineMat, edgeSpans.length*4);
  let ie = 0;
  for(const s of edgeSpans){
    for(const off of [-(ROAD_W/2-1.1), (ROAD_W/2-1.1)]){
      mtx.compose(new THREE.Vector3(s.mid, 0.018, s.c+off), qF, new THREE.Vector3(s.len, 0.22, 1));
      edgeInst.setMatrixAt(ie++, mtx);
      mtx.compose(new THREE.Vector3(s.c+off, 0.018, s.mid), qF, new THREE.Vector3(0.22, s.len, 1));
      edgeInst.setMatrixAt(ie++, mtx);
    }
  }
  edgeInst.count = ie;
  edgeInst.instanceMatrix.needsUpdate = true;
  edgeInst.frustumCulled = false;
  scene.add(edgeInst);
}

function addBox(parent, w,h,d, x,y,z, mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

function makeRoofDetail(group, w, d, h, style){
  const roofY = h/2;
  // parapet
  const par = new THREE.MeshStandardMaterial({ color:0x9b968c, roughness:0.95 });
  const t = 0.5;
  addBox(group, w, 0.7, t, 0, roofY+0.35, d/2-t/2, par);
  addBox(group, w, 0.7, t, 0, roofY+0.35, -d/2+t/2, par);
  addBox(group, t, 0.7, d, w/2-t/2, roofY+0.35, 0, par);
  addBox(group, t, 0.7, d, -w/2+t/2, roofY+0.35, 0, par);
  // roof surface
  const surf = new THREE.Mesh(new THREE.PlaneGeometry(w-1, d-1),
    new THREE.MeshStandardMaterial({ color:0x4a4d52, roughness:1 }));
  surf.rotation.x = -Math.PI/2; surf.position.y = roofY+0.06; surf.receiveShadow=true;
  group.add(surf);

  if(style === 'ac'){
    const acMat = new THREE.MeshStandardMaterial({ color:0xb6bcc2, roughness:0.5, metalness:0.3 });

      const aw=R(1.6,2.6);
      addBox(group, aw, R(0.9,1.5), aw, R(-w/2+2.5, w/2-2.5), roofY+0.8, R(-d/2+2.5, d/2-2.5), acMat);
    }
    if(w>14 && d>14){
      addBox(group, R(3,5), R(1.6,2.6), R(3,5), R(-4,4), roofY+1.2, R(-4,4), trimMats.dark);
    }
  } else if(style === 'tank'){
    const tankG = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,3,14),
      new THREE.MeshStandardMaterial({ color:0x8a6a4f, roughness:0.85 }));
    body.position.y = 2.6; body.castShadow=true;
    const roofC = new THREE.Mesh(new THREE.ConeGeometry(1.9,1.1,14),
      new THREE.MeshStandardMaterial({ color:0x6d5340, roughness:0.9 }));
    roofC.position.y = 4.6; roofC.castShadow=true;
    const legs = new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.6,1.4,10), trimMats.dark);
    legs.position.y = 0.7;
    tankG.add(body, roofC, legs);
    tankG.position.set(R(-w/2+3, w/2-3), roofY, R(-d/2+3, d/2-3));
    group.add(tankG);
  } else if(style === 'cooling'){
    const cm = new THREE.MeshStandardMaterial({ color:0x9aa1a8, roughness:0.5, metalness:0.4 });
    addBox(group, Math.min(w*0.5,8), 1.8, Math.min(d*0.5,8), 0, roofY+1, 0, cm);
    const fan = new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.4,16), trimMats.dark);
    fan.position.set(0, roofY+2, 0); group.add(fan);
  } else if(style === 'garden'){
    const surf2 = new THREE.Mesh(new THREE.PlaneGeometry(w-2.5, d-2.5),
      new THREE.MeshStandardMaterial({ map:makeGrassTex(), roughness:1, color:0x8fae72 }));
    surf2.material.map.repeat.set(w/3,d/3);
    surf2.rotation.x=-Math.PI/2; surf2.position.y=roofY+0.1; group.add(surf2);
    for(let i=0;i<RI(2,4); i++){
      const bush = new THREE.Mesh(new THREE.SphereGeometry(R(0.7,1.2), 8, 6),
        new THREE.MeshStandardMaterial({ color:pick([0x3f7a3a,0x4d8c45,0x376b34]), roughness:1 }));
      bush.castShadow = true;
      bush.position.set(R(-w/2+2, w/2-2), roofY+0.8, R(-d/2+2, d/2-2));
      group.add(bush);
    }
  }
  // occasional antenna
  if(rng()<0.5){
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,R(3,7),6), trimMats.metal);
    mast.position.set(R(-w/2+2, w/2-2), roofY+3, R(-d/2+2, d/2-2));
    mast.castShadow = true; group.add(mast);
  }
  // red aviation light
  if(h > 46){
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6),
      new THREE.MeshBasicMaterial({ color:0xff3b30 }));
    lamp.position.set(0, roofY + (style==='tank'?5.5:2.2), 0);
    group.add(lamp);
    neonSigns.push({ mesh:lamp, light:null, base:1, beacon:true });

function createBuilding(cx, cz, bw, bd, h, style){
  const group = new THREE.Group();
  group.position.set(cx, 0, cz);

  let facadeSet, roofStyle;
  if(style === 'glass'){ facadeSet = FACADES.glass; roofStyle = 'cooling'; }
  else if(style === 'brick'){ facadeSet = FACADES.brick; roofStyle = rng()<0.5?'tank':'ac'; }
  else { facadeSet = FACADES.concrete; roofStyle = pick(['ac','ac','tank','garden']); }

  const sides = Math.max(bw, bd) / 4;
  const tx = pick(facadeSet).clone(); tx.needsUpdate = true;
  tx.repeat.set(Math.max(1, Math.round(sides)), Math.max(1, Math.round(h/5)));
  const wallMat = new THREE.MeshStandardMaterial({ map:tx, roughness: style==='glass'?0.35:0.85,
    metalness: style==='glass'?0.35:0.02 });

  const body = addBox(group, bw, h, bd, 0, h/2, 0, wallMat);

  const baseH = 4.4;
  { // ground-floor storefront band on every style
    const st = shopTex.clone(); st.needsUpdate = true;
    st.repeat.set(Math.max(1, Math.round(bw/9)), 1);
    const shopMat = new THREE.MeshStandardMaterial({ map:st, roughness:0.6, metalness:0.1,
      emissiveMap:st, emissive:new THREE.Color(0xffffff), emissiveIntensity:0.0 });
    const aw = bw+0.16, ad = bd+0.16;
    addBox(group, aw, baseH, ad, 0, baseH/2, 0, shopMat);
    group.userData.shopMat = shopMat;
  }
  if(style === 'concrete' || style === 'glass'){
    // canopy over front
    const canopy = addBox(group, bw*0.5, 0.25, 2.2, R(-bw*0.15,bw*0.15), baseH+0.1, bd/2+1.0,
      new THREE.MeshStandardMaterial({ color:pick([0xc9463b,0x2f6fdb,0x2a9d8f,0xe0a32e]), roughness:0.6 }));
    canopy.castShadow = true;
  } else {
    // brick: awnings + flower boxes
    const awnMat = new THREE.MeshStandardMaterial({ color:pick([0x7a3b2e,0x2e5d4f,0x33415c]), roughness:0.8 });
    addBox(group, bw*0.6, 0.22, 1.8, 0, baseH, bd/2+0.8, awnMat);
    if(rng()<0.6){
      const door = addBox(group, 2.4, 3.4, 0.3, R(-bw*0.2,bw*0.2), 1.7, bd/2+0.1,
        new THREE.MeshStandardMaterial({ color:0x4a3527, roughness:0.8 }));
      door.castShadow = true;
    }
  }

  if(h > 26){
    // setback upper volume
    const uh = h*0.32;
    const sub = addBox(group, bw*0.78, uh, bd*0.78, 0, h+uh/2, 0, wallMat);
    group.userData.height = h+uh;
    makeRoofDetail(group, bw*0.78, bd*0.78, h+uh, roofStyle);
    buildingTops.push({ x:cx, z:cz, h:h+uh });
  } else {
    group.userData.height = h;
    makeRoofDetail(group, bw, bd, h, roofStyle);
    buildingTops.push({ x:cx, z:cz, h });
  }

  // neon sign on some buildings
  if(rng() < 0.38){
    const word = pick(NEON_WORDS);
    const color = pick(['#ff3b6b','#4cc9f0','#ffd166','#b517ff','#00f5d4','#ff7b00']);
    const nt = makeNeonTex(word, color);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(7, 3),
      new THREE.MeshBasicMaterial({ map:nt, transparent:true, toneMapped:false }));
    sign.position.set(R(-bw*0.2, bw*0.2), baseH + R(2, Math.max(2.5, h*0.35)), bd/2 + 0.35);
    group.add(sign);
    let light = null;
    if(h < 30){
      light = new THREE.PointLight(new THREE.Color(color), 0, 26, 2);
      light.position.set(sign.position.x, sign.position.y-0.5, bd/2 + 2.4);
      group.add(light);
    }
    neonSigns.push({ mesh:sign, light, base:1.0, beacon:false });
  }

  scene.add(group);
  colliders.push({ x0:cx-bw/2-0.2, x1:cx+bw/2+0.2, z0:cz-bd/2-0.2, z1:cz+bd/2+0.2 });
  if(group.userData.shopMat) shopMats.push(group.userData.shopMat);
  return group;
}

function buildCity(){
  for(let i=0;i<N;i++){
    for(let j=0;j<N;j++){
      const bx = -HALF + i*PITCH + ROAD_W/2;
      const bz = -HALF + j*PITCH + ROAD_W/2;
      const cx = bx + BLOCK/2, cz = bz + BLOCK/2;
      const dist = Math.hypot(cx, cz);
      const inner = dist < 95;
      const mid = dist < 175;

      // park block?
      if((i===4 && j===4) || (i===1 && j===6) || (i===7 && j===2)){
        buildPark(cx, cz);
        continue;
      }

      // split block into sub-lots
      const rows = rng()<0.5 ? 2 : 1;
      const cols = rng()<0.45 ? 2 : 1;
      const cellW = BLOCK/cols, cellD = BLOCK/rows;
      for(let a=0;a<cols;a++){
        for(let b=0;b<rows;b++){
          const px = bx + cellW*(a+0.5);
          const pz = bz + cellD*(b+0.5);
          const margin = 4.5;
          let bw = cellW - margin*2;
          let bd = cellD - margin*2;
          // occasional vacant lot
          if(rng() < 0.06){ continue; }
          let h;
          const r = rng();
          if(inner)      h = r<0.30 ? R(38,74) : r<0.65 ? R(24,42) : R(12,24);
          else if(mid)   h = r<0.15 ? R(28,46) : r<0.5 ? R(16,30) : R(9,17);
          else           h = r<0.12 ? R(14,24) : R(7,15);
          if(cols>1||rows>1) h *= R(0.7,1.05);
          const style = inner ? (rng()<0.5?'glass':'concrete')
                      : mid  ? (rng()<0.45?'concrete':(rng()<0.5?'glass':'brick'))
                             : 'brick';
          createBuilding(px, pz, bw, bd, h, style);
        }
      }

      // street trees along block edges
      for(const side of [0,1,2,3]){
        if(rng() < 0.22) continue;
        const count = RI(2,3);
        for(let t=0;t<count;t++){
          const f = (t+0.5)/count;
          let tx, tz;
          if(side===0){ tx = bx + BLOCK*f; tz = bz + 2.2; }
          if(side===1){ tx = bx + BLOCK*f; tz = bz + BLOCK - 2.2; }
          if(side===2){ tx = bx + 2.2; tz = bz + BLOCK*f; }
          if(side===3){ tx = bx + BLOCK - 2.2; tz = bz + BLOCK*f; }
          if(rng()<0.25) continue;
          addTree(tx, tz, R(0.85,1.25));
        }
      }
      // street lamps at block corners
      for(const [ox,oz] of [[0,0],[BLOCK,0],[0,BLOCK],[BLOCK,BLOCK]]){
        if(rng()<0.3) continue;
        addLamp(bx+ox, bz+oz, (ox===0?-1:1), (oz===0?-1:1));
      }
    }
  }
}

/* ============================== TREES & STREET FURNITURE ============================== */
const TREE_LEAF = [0x3f7a35, 0x4a8a3c, 0x356b30, 0x55924a, 0x2f6b3f];
let leafMats = null, barkMat = null;
function treeMaterials(){
  if(!leafMats){
    leafMats = TREE_LEAF.map(c=> new THREE.MeshStandardMaterial({color:c, roughness:1, flatShading:true}));
    barkMat = new THREE.MeshStandardMaterial({color:0x6b4f3a, roughness:1, flatShading:true});
  }
  return leafMats;
}
const trunkGeo = new THREE.CylinderGeometry(0.16, 0.24, 1, 7);
const blobGeo  = new THREE.IcosahedronGeometry(1, 0);
const trunkMats = [], leafInstMats = [[],[],[],[],[]];

function addTree(x, z, s=1){
  treeMaterials();
  const q = new THREE.Quaternion(), e = new THREE.Euler();
  const m = new THREE.Matrix4();
  m.compose(new THREE.Vector3(x, 0.24 + 1.35*s, z), q.identity(),
            new THREE.Vector3(s, 2.7*s, s));
  trunkMats.push(m.clone());
  const n = RI(2,3);
  for(let i=0;i<n;i++){
    const r = R(1.2, 1.7)*s;
    const li = (rng()*leafMats.length)|0;
    e.set(R(0,3), R(0,3), R(0,3)); q.setFromEuler(e);
    m.compose(new THREE.Vector3(x + R(-0.7,0.7)*s, 0.24 + (2.9 + i*0.9)*s + R(0,0.4), z + R(-0.7,0.7)*s),
              q, new THREE.Vector3(r, r*R(0.7,0.95), r));
    leafInstMats[li].push(m.clone());
  }
}
function flushTrees(){
  const trunk = new THREE.InstancedMesh(trunkGeo, barkMat, trunkMats.length);
  trunkMats.forEach((m,i)=> trunk.setMatrixAt(i,m));
  trunk.instanceMatrix.needsUpdate = true;
  trunk.castShadow = true;
  scene.add(trunk);
  leafInstMats.forEach((list, li)=>{
    if(!list.length) return;
    const im = new THREE.InstancedMesh(blobGeo, leafMats[li], list.length);
    list.forEach((m,i)=> im.setMatrixAt(i,m));
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = true;
    scene.add(im);
  });
}

/* street lamps with fake light pools */
function makePoolTex(){
  const c = cnv(128,128), x=c.getContext('2d');
  const g = x.createRadialGradient(64,64,4,64,64,62);
  g.addColorStop(0,'rgba(255,214,150,0.85)');
  g.addColorStop(0.45,'rgba(255,196,120,0.32)');
  g.addColorStop(1,'rgba(255,190,110,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const poolTex = makePoolTex();
const lampPoolGeo = new THREE.PlaneGeometry(9, 9);
const LAMP_LEN = 2.3;
const LAMP_DIRS = [[0.7071,0.7071],[-0.7071,0.7071],[0.7071,-0.7071],[-0.7071,-0.7071]];
const lampDefs = [];
let lampLensMat = null, lampPoolMesh = null;

function addLamp(x, z, sx, sz){
  const di = (sx>0 ? 0 : 1) + (sz>0 ? 0 : 2);
  lampDefs.push({ x, z, di });
}
function flushLamps(){
  const poleMat = trimMats.dark;
  const poleGeo = new THREE.CylinderGeometry(0.09,0.13,6.2,8);
  const armBase = new THREE.CylinderGeometry(0.07,0.07,LAMP_LEN,6);
  const headGeo = new THREE.BoxGeometry(0.8,0.28,0.45);
  lampLensMat = new THREE.MeshStandardMaterial({ color:0xfff2d8, emissive:0xffd9a0, emissiveIntensity:0 });
  const lensGeo = new THREE.BoxGeometry(0.62,0.1,0.34);

  const byDir = [[],[],[],[]];
  for(const l of lampDefs) byDir[l.di].push(l);

  const poleInst = new THREE.InstancedMesh(poleGeo, poleMat, lampDefs.length);
  const poleM = new THREE.Matrix4();
  lampDefs.forEach((l,i)=>{
    poleM.makeTranslation(l.x, 0.24+3.1, l.z);
    poleInst.setMatrixAt(i, poleM);
  });
  poleInst.instanceMatrix.needsUpdate = true;
  poleInst.castShadow = true;
  scene.add(poleInst);

  const poolInst = new THREE.InstancedMesh(lampPoolGeo, new THREE.MeshBasicMaterial({
    map:poolTex, transparent:true, opacity:0, depthWrite:false,
    blending:THREE.AdditiveBlending, toneMapped:false }), lampDefs.length);
  lampPoolMesh = poolInst;

  const mm = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(),
        sc = new THREE.Vector3(1,1,1);
  byDir.forEach((list, di)=>{
    if(!list.length) return;
    const [dx, dz] = LAMP_DIRS[di];
    const rotY = Math.atan2(-dz, dx);

    const armGeo = armBase.clone();
    e.set(0, rotY, 0); q.setFromEuler(e);
    const mArmRot = new THREE.Matrix4().compose(new THREE.Vector3(), q, sc);
    const mZ = new THREE.Matrix4().makeRotationZ(Math.PI/2);
    armGeo.applyMatrix4(mArmRot.clone().multiply(mZ));

    const headGeoD = headGeo.clone(); headGeoD.applyMatrix4(mArmRot);
    const lensGeoD = lensGeo.clone(); lensGeoD.applyMatrix4(mArmRot);

    const armInst = new THREE.InstancedMesh(armGeo, poleMat, list.length);
    const headInst = new THREE.InstancedMesh(headGeoD, poleMat, list.length);
    const lensInst = new THREE.InstancedMesh(lensGeoD, lampLensMat, list.length);

    list.forEach((l,i)=>{
      const hx = l.x + dx*LAMP_LEN, hz = l.z + dz*LAMP_LEN;
      mm.makeTranslation(l.x + dx*LAMP_LEN/2, 0.24+6.1, l.z + dz*LAMP_LEN/2);
      armInst.setMatrixAt(i, mm);
      mm.makeTranslation(hx, 0.24+6.0, hz);
      headInst.setMatrixAt(i, mm);
      mm.makeTranslation(hx, 0.24+5.85, hz);
      lensInst.setMatrixAt(i, mm);
      const mPool = new THREE.Matrix4().makeRotationX(-Math.PI/2);
      mPool.setPosition(hx, 0.27, hz);
      poolInst.setMatrixAt(lampDefs.indexOf(l), mPool);
    });
    armInst.instanceMatrix.needsUpdate = true;
    headInst.instanceMatrix.needsUpdate = true;
    lensInst.instanceMatrix.needsUpdate = true;
    armInst.castShadow = headInst.castShadow = true;
    scene.add(armInst, headInst, lensInst);
  });
  poolInst.instanceMatrix.needsUpdate = true;
  poolInst.frustumCulled = false;
  scene.add(poolInst);
}

/* benches, bins */
function addBench(x, z, rotY){
  const g = new THREE.Group();

function makeCar(colorHex, type){

  const headMat = new THREE.MeshStandardMaterial({ color:0xfff6de, emissive:0xffeec2, emissiveIntensity:0 });

const roadCenters = [];
for(let i=0;i<=N;i++) roadCenters.push(-HALF + i*PITCH);
const cars = [];
function spawnCar(){
  const horiz = rng() < 0.5;
  const ci = RI(0, N);
  const dir = rng() < 0.5 ? 1 : -1;
  const laneOff = (horiz === (dir > 0)) ? 3.4 : -3.4;   // right-hand traffic
  const type = rng()<0.15 ? 'van' : (rng()<0.15 ? 'sport' : 'sedan');
  const built = makeCar(pick(CAR_COLORS), type);
  const car = {
    ...built, horiz, dir,
    cross: -HALF + ci*PITCH,
    along: R(-HALF, HALF),
    lane: laneOff,
    speed: R(8.5, 13.5),
    wait: 0,
    L: type==='van'?4.9:4.4,
  };
  scene.add(car.g);
  cars.push(car);
}
function carPos(car){
  const a = car.along, c = car.cross + car.lane;
  // model faces local +X; rotation.y=θ maps +X to (cosθ, -sinθ) in world
  if(car.horiz) return { x:a, z:c, yaw: car.dir>0 ? 0 : Math.PI };
  return { x:c, z:a, yaw: car.dir>0 ? -Math.PI/2 : Math.PI/2 };
}
function updateCar(car, dt){
  if(car.wait > 0){ car.wait -= dt; return; }
  // follow distance to same-lane car ahead
  for(const o of cars){
    if(o === car || o.horiz !== car.horiz) continue;
    if(Math.abs(o.cross + o.lane - (car.cross + car.lane)) > 0.5) continue;
    const d = (o.along - car.along) * car.dir;
    if(d > 0 && d < 11){ car.wait = 0.35; return; }
  }
  // brake for the player ahead in our lane
  {
    const ahead = (car.horiz ? (player.pos.z - car.along) : (player.pos.x - car.along)) * car.dir;
    const lateralD = car.horiz ? Math.abs(player.pos.x - (car.cross + car.lane))
                               : Math.abs(player.pos.z - (car.cross + car.lane));
    if(ahead > 0 && ahead < 7 && lateralD < 2.2){ car.wait = 0.4; return; }
  }
  // yield to cross traffic approaching the next intersection
  const carCross = car.cross + car.lane;
  const myPriority = car.horiz ? 1 : 0;   // east-west goes first
  for(const ic of roadCenters){
    const d = (ic - car.along) * car.dir;
    if(d <= 3 || d >= 14) continue;
    let blocked = false;
    for(const o of cars){
      if(o.horiz === car.horiz) continue;
      if(Math.abs((o.cross + o.lane) - ic) > 1.5) continue;   // not on the crossing road
      const od = (carCross - o.along) * o.dir;                // its approach distance
      if(od <= 0 || od > 16) continue;
      if((o.horiz ? 1 : 0) <= myPriority) continue;           // we go first
      blocked = true; break;
    }
    if(blocked){ car.wait = 0.5; return; }
  }
  car.along += car.dir * car.speed * dt;
  if(car.along > HALF + 8) car.along = -HALF - 8;
  if(car.along < -HALF - 8) car.along = HALF + 8;
  const p = carPos(car);
  car.g.position.set(p.x, 0, p.z);
  car.g.rotation.y = p.yaw;
}
for(let i=0;i<CAR_COUNT;i++) spawnCar();

/* pedestrian navigation nodes */
const nodes = [];
const nodeIdx = new Map();
const key = (i,j)=> i + ',' + j;
for(let i=0;i<=N;i++) for(let j=0;j<=N;j++) nodeIdx.set(key(i,j), nodes.length),
  nodes.push({ i, j, x:-HALF + i*PITCH, z:-HALF + j*PITCH, edges:[] });
for(let i=0;i<=N;i++) for(let j=0;j<=N;j++){
  const a = nodeIdx.get(key(i,j));
  if(i<N){ const b = nodeIdx.get(key(i+1,j)); nodes[a].edges.push(b); nodes[b].edges.push(a); }
  if(j<N){ const b = nodeIdx.get(key(i,j+1)); nodes[a].edges.push(b); nodes[b].edges.push(a); }
}
function nodeNear(x, z){
  const i = clamp(Math.round((x + HALF)/PITCH), 0, N);
  const j = clamp(Math.round((z + HALF)/PITCH), 0, N);
  return nodeIdx.get(key(i,j));
}
const peds = [];
function pickNext(from, avoid){
  const cand = nodes[from].edges;
  if(cand.length > 1 && avoid !== undefined){
    let c = cand[(rng()*cand.length)|0];
    if(c === avoid) c = cand[(cand.indexOf(c)+1) % cand.length];
    return c;
  }
  return cand[(rng()*cand.length)|0];
}
function spawnPed(){
  const p = makePerson();
  const a = nodeNear(R(-HALF,HALF), R(-HALF,HALF));
  const b = pickNext(a);
  const c = pickNext(b, a);
  const ped = {
    ...p, a, b, c, t: rng(), speed: R(1.1, 1.75),
    phase: R(0, Math.PI*2), stride: R(6.5, 8.5),
    lastX: 0, lastZ: 0, yawInit: false,
  };
  scene.add(p.g);
  peds.push(ped);
}
const PED_OFF = ROAD_W/2 + 1.2;
function segOffset(A, B, out){
  const dx = B.x - A.x, dz = B.z - A.z;
  const len = Math.hypot(dx, dz) || 1;
  out.x = -dz/len * PED_OFF; out.z = dx/len * PED_OFF;
  return len;
}
const _o1 = {x:0,z:0}, _o2 = {x:0,z:0};
const smooth = (e0, e1, x)=>{ const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };

function updatePed(ped, dt){
  const A = nodes[ped.a], B = nodes[ped.b], C = nodes[ped.c];
  const len = segOffset(A, B, _o1);
  segOffset(B, C, _o2);
  ped.t += (ped.speed / len) * dt;
  if(ped.t >= 1){
    ped.t = 0;
    ped.a = ped.b; ped.b = ped.c;
    ped.c = pickNext(ped.c, ped.a);
    return;
  }
  // blend corner offset so the path curves smoothly around the junction
  const k = smooth(0.7, 1.0, ped.t);
  const ox = lerp(_o1.x, _o2.x, k), oz = lerp(_o1.z, _o2.z, k);
  const x = lerp(A.x, B.x, ped.t) + ox;
  const z = lerp(A.z, B.z, ped.t) + oz;
  ped.g.position.set(x, 0.24, z);
  if(ped.yawInit){
    const dx = x - ped.lastX, dz = z - ped.lastZ;
    if(dx*dx + dz*dz > 1e-6)
      ped.g.rotation.y = lerp(ped.g.rotation.y, Math.atan2(dx, dz), Math.min(1, dt*10));
  } else { ped.yawInit = true; }
  ped.lastX = x; ped.lastZ = z;
  // walk cycle
  const s = Math.sin(ped.phase + ped.t * ped.stride * len * 0.5);
  const swing = s * 0.62;
  ped.legL.rotation.x =  swing;
  ped.legR.rotation.x = -swing;
  ped.armL.rotation.x = -swing * 0.75;
  ped.armR.rotation.x =  swing * 0.75;
  ped.g.position.y = 0.24 + Math.abs(Math.cos(ped.phase + ped.t * ped.stride * len * 0.5)) * 0.035;
  // avoid player
  const pdx = ped.g.position.x - player.pos.x, pdz = ped.g.position.z - player.pos.z;
  if(pdx*pdx + pdz*pdz < 1.6){
    ped.g.position.x += pdx * dt * 3;
    ped.g.position.z += pdz * dt * 3;
  }
}
for(let i=0;i<PED_COUNT;i++) spawnPed();

/* camera collision: keep out of building volumes */
function camBlocked(x, y, z){
  for(const c of colliders){
    if(x > c.x0-0.6 && x < c.x1+0.6 && z > c.z0-0.6 && z < c.z1+0.6) return true;
  }
  return false;
}

const WORLD_LIM = HALF + 130;
function resolvePlayer(){
  const r = 0.45;
  player.pos.x = clamp(player.pos.x, -WORLD_LIM, WORLD_LIM);
  player.pos.z = clamp(player.pos.z, -WORLD_LIM, WORLD_LIM);
  for(const c of colliders){
    if(player.pos.x > c.x0 - r && player.pos.x < c.x1 + r &&
       player.pos.z > c.z0 - r && player.pos.z < c.z1 + r){
      const dl = player.pos.x - (c.x0 - r), drr = (c.x1 + r) - player.pos.x;
      const db = player.pos.z - (c.z0 - r), dt2 = (c.z1 + r) - player.pos.z;
      const m = Math.min(dl, drr, db, dt2);
      if(m === dl) player.pos.x = c.x0 - r;
      else if(m === drr) player.pos.x = c.x1 + r;
      else if(m === db) player.pos.z = c.z0 - r;
      else player.pos.z = c.z1 + r;
    }
  }
}

/* ============================== DAY / NIGHT ============================== */
const DAY_STOPS = [
  { t:0.00, zen:0x05070f, hor:0x0d1424, sun:0x8fa8d0, sunI:0.10, hemi:0.16, hemiSky:0x2a3550, hemiGnd:0x14161c, night:1.0, fog:0x0a1018 },
  { t:0.19, zen:0x0a1226, hor:0x1d2a45, sun:0xa88bd0, sunI:0.14, hemi:0.22, hemiSky:0x33406a, hemiGnd:0x1a1c24, night:0.95, fog:0x141d30 },
  { t:0.23, zen:0x1e3a6b, hor:0xd97b4f, sun:0xffa15c, sunI:0.9,  hemi:0.45, hemiSky:0x6f86c0, hemiGnd:0x3a3230, night:0.45, fog:0x8a6a58 },
  { t:0.27, zen:0x2f6db5, hor:0xe8a570, sun:0xffd9a0, sunI:2.2,  hemi:0.8,  hemiSky:0xa8c2ee, hemiGnd:0x55503f, night:0.1,  fog:0xc9a689 },
  { t:0.34, zen:0x2c74c6, hor:0xbcd3e6, sun:0xfff1da, sunI:2.6,  hemi:0.95, hemiSky:0xbfd6ff, hemiGnd:0x5d5a4e, night:0.0,  fog:0x9fb4c9 },
  { t:0.50, zen:0x2a7ad0, hor:0xc6dcee, sun:0xfffaf0, sunI:2.9,  hemi:1.05, hemiSky:0xc6dcff, hemiGnd:0x63604f, night:0.0,  fog:0xa8bdd2 },
  { t:0.64, zen:0x2c74c6, hor:0xbcd3e6, sun:0xfff1da, sunI:2.6,  hemi:0.95, hemiSky:0xbfd6ff, hemiGnd:0x5d5a4e, night:0.0,  fog:0x9fb4c9 },
  { t:0.74, zen:0x27528f, hor:0xe8935c, sun:0xffb070, sunI:1.6,  hemi:0.7,  hemiSky:0x93aade, hemiGnd:0x4e4639, night:0.15, fog:0xc08a63 },
  { t:0.79, zen:0x14224a, hor:0x8a4a55, sun:0xd96a4a, sunI:0.4,  hemi:0.4,  hemiSky:0x5a6396, hemiGnd:0x2c2830, night:0.6,  fog:0x503548 },
  { t:0.84, zen:0x070a14, hor:0x131a2e, sun:0x8fa8d0, sunI:0.10, hemi:0.18, hemiSky:0x2c3757, hemiGnd:0x15171e, night:1.0, fog:0x0c1220 },
  { t:1.00, zen:0x05070f, hor:0x0d1424, sun:0x8fa8d0, sunI:0.10, hemi:0.16, hemiSky:0x2a3550, hemiGnd:0x14161c, night:1.0, fog:0x0a1018 },
];
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function dayState(t){
  t = ((t % 1) + 1) % 1;
  let a = DAY_STOPS[0], b = DAY_STOPS[DAY_STOPS.length-1];
  for(let i=0;i<DAY_STOPS.length-1;i++){
    if(t >= DAY_STOPS[i].t && t <= DAY_STOPS[i+1].t){ a = DAY_STOPS[i]; b = DAY_STOPS[i+1]; break; }
  }
  const f = (t - a.t) / Math.max(1e-5, b.t - a.t);
  return { a, b, f };
}

let gameT = 7.5/24; // start 07:30
const clockEl = document.getElementById('clock');
const phaseEl = document.getElementById('phase');
const speedEl = document.getElementById('speedo');

function updateDayNight(dt){
  gameT += dt / DAY_LENGTH;
  const { a, b, f } = dayState(gameT);

  skyUniforms.uZenith.value.copy(lerpC(_c1, a.zen, b.zen, f));
  skyUniforms.uHorizon.value.copy(lerpC(_c2, a.hor, b.hor, f));
  skyUniforms.uSunColor.value.copy(lerpC(_c1, a.sun, b.sun, f));
  skyUniforms.uNight.value = lerp(a.night, b.night, f);

  sun.color.copy(lerpC(_c1, a.sun, b.sun, f));
  sun.intensity = lerp(a.sunI, b.sunI, f);
  hemi.intensity = lerp(a.hemi, b.hemi, f);
  hemi.color.copy(lerpC(_c1, a.hemiSky, b.hemiSky, f));
  hemi.groundColor.copy(lerpC(_c1, a.hemiGnd, b.hemiGnd, f));

  const fogC = lerpC(_c1, a.fog, b.fog, f);
  scene.fog.color.copy(fogC);
  renderer.setClearColor(fogC);

  // sun position
  const dayT = ((gameT % 1) + 1) % 1;
  const ang = (dayT - 0.25) * Math.PI * 2;
  const el = Math.sin(ang), az = Math.cos(ang);
  sun.position.set(az * 120 + player.pos.x, el * 130 + 14, az * 40 + 70 + player.pos.z);
  sun.target.position.set(player.pos.x, 0, player.pos.z);
  skyUniforms.uSunDir.value.set(az * 0.7, el, 0.45).normalize();

  // night lighting features
  const nightAmt = skyUniforms.uNight.value;
  const lampOn = clamp((nightAmt - 0.25) / 0.5, 0, 1);
  if(lampLensMat) lampLensMat.emissiveIntensity = lampOn * 2.4;
  if(lampPoolMesh) lampPoolMesh.material.opacity = lampOn * 0.5;
  for(const s of neonSigns){
    if(s.beacon){ s.mesh.visible = (Math.sin(performance.now()*0.004) > 0.4); continue; }
    const flick = 0.85 + 0.15*Math.sin(performance.now()*0.02 + s.mesh.position.x);
    s.mesh.material.opacity = 1;
    s.mesh.visible = true;
    if(s.light) s.light.intensity = lampOn * 9 * flick;
  }
  for(const m of shopMats) m.emissiveIntensity = lampOn * 0.85;
  for(const c of cars){ c.headMat.emissiveIntensity = lampOn*2.2; c.glowMat.opacity = lampOn*0.7; c.beam.material.opacity = lampOn*0.32; }

  // HUD clock
  const mins = Math.floor(dayT * 1440);
  const hh = String(Math.floor(mins/60)).padStart(2,'0');
  const mm = String(mins%60).padStart(2,'0');
  clockEl.textContent = `${hh}:${mm}`;
  const hr = dayT*24;
  phaseEl.textContent = hr < 5 ? 'Night' : hr < 7.5 ? 'Dawn' : hr < 11.5 ? 'Morning'
    : hr < 14 ? 'Midday' : hr < 17.5 ? 'Afternoon' : hr < 20 ? 'Evening' : hr < 21.5 ? 'Dusk' : 'Night';
}

/* ============================== MAIN LOOP ============================== */
let last = performance.now();
const camDir = new THREE.Vector3(), camRight = new THREE.Vector3();
const camTarget = new THREE.Vector3();
let bobPhase = 0;

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  /* --- player movement --- */
  let ix = 0, iz = 0;
  if(locked){
    if(keys['KeyW']) iz += 1;
    if(keys['KeyS']) iz -= 1;
    if(keys['KeyA']) ix -= 1;
    if(keys['KeyD']) ix += 1;
  }
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
  const target = (iz||ix) ? (sprint ? 7.4 : 3.1) : 0;
  player.speed += (target - player.speed) * Math.min(1, dt * (target > player.speed ? 7 : 9));

  camDir.set(Math.sin(player.yaw), 0, Math.cos(player.yaw));
  camRight.set(camDir.z, 0, -camDir.x);
  const move = new THREE.Vector3()
    .addScaledVector(camDir, iz).addScaledVector(camRight, ix);
  if(move.lengthSq() > 0){
    move.normalize();
    player.pos.addScaledVector(move, player.speed * dt);
    resolvePlayer();
    const targetYaw = Math.atan2(move.x, move.z);
    let d = targetYaw - playerMesh.g.rotation.y;
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    playerMesh.g.rotation.y += d * Math.min(1, dt * 11);
    bobPhase += dt * player.speed * 1.7;
  } else {
    bobPhase *= 1 - Math.min(1, dt*6);
  }

  const walking = player.speed > 0.3;
  const swing = walking ? Math.sin(bobPhase) * clamp(player.speed/7.4,0,1) * 0.75 : 0;
  playerMesh.legL.rotation.x =  swing;
  playerMesh.legR.rotation.x = -swing;
  playerMesh.armL.rotation.x = -swing * 0.8;
  playerMesh.armR.rotation.x =  swing * 0.8;
  playerMesh.g.position.set(player.pos.x, 0.24 + Math.abs(Math.sin(bobPhase))*0.045*(walking?1:0), player.pos.z);

  /* --- camera --- */
  camTarget.set(player.pos.x, 1.55, player.pos.z);
  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  let dist = 5.6;
  for(let d=1.2; d<=dist; d+=0.45){
    const cx = camTarget.x - Math.sin(player.yaw)*cp*d;
    const cz = camTarget.z - Math.cos(player.yaw)*cp*d;
    const cy = camTarget.y - sp*d + 0.4;
    if(camBlocked(cx, cy, cz)){ dist = Math.max(1.2, d - 0.5); break; }
  }
  camera.position.set(
    camTarget.x - Math.sin(player.yaw)*cp*dist,
    Math.max(0.8, camTarget.y - sp*dist + 0.4),
    camTarget.z - Math.cos(player.yaw)*cp*dist
  );
  camera.lookAt(camTarget);

  /* --- world updates --- */
  for(const c of cars) updateCar(c, dt);
  for(const p of peds) updatePed(p, dt);
  updateDayNight(dt);

  const kmh = Math.round(player.speed * 3.6);
  speedEl.textContent = kmh > 1 ? (sprint ? `Sprint — ${kmh} km/h` : `Walking — ${kmh} km/h`) : 'Idle';

  frameNo++;
  if(frameNo % 3 === 0) renderer.shadowMap.needsUpdate = true;
  renderer.render(scene, camera);
}
let frameNo = 0;

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

buildCity();
flushTrees();
flushLamps();
// debug handle for automated tests
globalThis.__gameDebug = { scene, camera, renderer, colliders, cars, peds, player, lampDefs, trunkMats,
  nodes, keys, sun, hemi, skyUniforms, shopMats, neonSigns, clockEl, phaseEl,
  get lampLensMat(){ return lampLensMat; }, get lampPoolMesh(){ return lampPoolMesh; },
  setTime: t => { gameT = t; },
  setLock: v => { locked = v; },
  get info(){ return renderer.info; } };
// scatter a few distant skyline billboards on the horizon
{
  const skyT = makeSkylineTex();
  for(let i=0;i<14;i++){
    const a = (i/14)*Math.PI*2 + R(-0.1,0.1);
    const r = HALF + R(150, 320);
    const b = new THREE.Mesh(new THREE.PlaneGeometry(150, 38),
      new THREE.MeshBasicMaterial({ map:skyT, transparent:true, toneMapped:false, fog:true,
        color:0x8fa6c4 }));
    b.position.set(Math.cos(a)*r, 19, Math.sin(a)*r);
    b.lookAt(0, 19, 0);
    scene.add(b);
  }
}
requestAnimationFrame(frame);
</script>
