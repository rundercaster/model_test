<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SABLE CITY — a walkable district</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070c;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{display:block}
  #hud{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:1;transition:opacity .6s ease}
  #hud.off{opacity:0}
  #clock{position:absolute;top:26px;right:30px;text-align:right;color:#f4f7fc;
    text-shadow:0 2px 20px rgba(0,0,0,.85)}
  #clock .t{font-size:38px;font-weight:200;letter-spacing:.07em;font-variant-numeric:tabular-nums}
  #clock .d{font-size:9px;letter-spacing:.45em;text-transform:uppercase;opacity:.6;margin-top:5px}
  #map{position:absolute;left:26px;bottom:26px;width:180px;height:180px;border-radius:50%;
    box-shadow:0 22px 46px -14px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.16),
               inset 0 0 46px rgba(0,0,0,.55)}
  #hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:14px;
    padding:11px 18px;border-radius:999px;background:rgba(10,14,22,.5);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:#c6cfdd;transition:opacity 1.1s ease;white-space:nowrap}
  #hint.gone{opacity:0}
  #hint b{color:#fff;font-weight:600}
  #hint i{font-style:normal;opacity:.28}
  #toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);font-size:11px;letter-spacing:.28em;
    text-transform:uppercase;color:#fff;opacity:0;transition:opacity .45s;text-shadow:0 2px 14px #000}
  #gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;cursor:pointer;
    background:radial-gradient(120% 95% at 50% 18%,#16263f 0%,#080b13 55%,#04060a 100%);
    transition:opacity 1s ease}
  #gate.hide{opacity:0;pointer-events:none}
  .brand{text-align:center;padding:0 24px;max-width:min(760px,92vw)}
  .brand .k{font-size:10px;letter-spacing:.6em;text-transform:uppercase;color:#7fa6d8;margin-bottom:22px}
  .brand h1{margin:0;font-size:clamp(42px,9.5vw,108px);font-weight:800;letter-spacing:.13em;line-height:.95;
    background:linear-gradient(180deg,#ffffff 0%,#a6c9ff 46%,#ff74b0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 10px 46px rgba(120,160,255,.35))}
  .brand .s{margin-top:18px;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:#8e9bb0}
  #load{margin:38px auto 0;width:min(420px,80vw);height:2px;background:rgba(255,255,255,.1);overflow:hidden}
  #load i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7fd4ff,#ff7ab8);
    transition:width .35s ease}
  #st{margin-top:12px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#6d7d94;height:12px}
  .keys{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#93a2b8;transition:opacity .5s}
  .keys span{display:flex;gap:7px;align-items:center}
  kbd{font:inherit;font-weight:700;color:#eaf1ff;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);border-bottom-width:2px;border-radius:5px;padding:3px 7px;letter-spacing:.06em}
  #go{margin-top:30px;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:#fff;opacity:0;
    transition:opacity .6s}
  #go.on{opacity:1;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  #pause{position:fixed;inset:0;z-index:15;display:none;place-items:center;cursor:pointer;
    background:rgba(4,7,12,.55);backdrop-filter:blur(7px)}
  #pause.on{display:grid}
  #pause div{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:#fff;opacity:.85}
  #err{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:32px;text-align:center;
    color:#ffb4c8;font-size:13px;line-height:1.7;background:#05070c}
</style>
</head>
<body>
<div id="hud" class="off">
  <div id="clock"><div class="t">—</div><div class="d">—</div></div>
  <canvas id="map" width="360" height="360"></canvas>
  <div id="hint">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <b>walk</b></span><i>/</i>
    <span><kbd>shift</kbd> <b>sprint</b></span><i>/</i><span><kbd>space</kbd> <b>jump</b></span><i>/</i>
    <span><kbd>E</kbd> <b>drive</b></span><i>/</i><span><kbd>T</kbd> <b>time</b></span><i>/</i>
    <span><kbd>C</kbd> <b>cam</b></span><i>/</i><span><kbd>H</kbd> <b>hud</b></span>
  </div>
  <div id="toast"></div>
</div>

<div id="gate">
  <div class="brand">
    <div class="k">district nine · live build</div>
    <h1>SABLE CITY</h1>
    <div class="s">streets, traffic &amp; a sun that sets</div>
    <div id="load"><i></i></div>
    <div id="st">booting</div>
    <div class="keys" id="keyrow" style="opacity:0">
      <span><kbd>W A S D</kbd> move</span><span><kbd>mouse</kbd> look</span><span><kbd>shift</kbd> sprint</span>
      <span><kbd>space</kbd> jump</span><span><kbd>E</kbd> enter car</span><span><kbd>wheel</kbd> zoom</span>
      <span><kbd>T</kbd> time</span><span><kbd>C</kbd> camera</span><span><kbd>H</kbd> hud</span>
    </div>
    <div id="go">click to enter</div>
  </div>
</div>
<div id="pause"><div>paused — click to resume</div></div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0 · helpers
   ============================================================ */
const PI=Math.PI, TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
let _s=987654321;
function rnd(){_s^=_s<<13;_s^=_s>>>17;_s^=_s<<5;_s>>>=0;return _s/4294967296;}
const rr=(a,b)=>a+rnd()*(b-a);
const ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const chance=p=>rnd()<p;
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function jit(h,amt){const c=hexRGB(h),d=(rnd()*2-1)*amt*255;
  return `rgb(${clamp(c[0]+d,0,255)|0},${clamp(c[1]+d,0,255)|0},${clamp(c[2]+d,0,255)|0})`;}
const raf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._h);
  e._h=setTimeout(()=>e.style.opacity=0,1500);}

/* ============================================================
   1 · renderer / scene / post
   ============================================================ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
document.body.appendChild(renderer.domElement);
const ANISO=renderer.capabilities.getMaxAnisotropy();

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0c1220,0.0016);
const camera=new THREE.PerspectiveCamera(57,innerWidth/innerHeight,0.1,3200);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.62,0.80);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});

/* ============================================================
   2 · canvas textures
   ============================================================ */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function CT(c,srgb=true){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;t.anisotropy=ANISO;return t;}
function speckle(g,w,h,n,cols,a=1){for(let i=0;i<n;i++){g.globalAlpha=a*(0.25+rnd()*0.75);
  g.fillStyle=pick(cols);g.fillRect(rnd()*w,rnd()*h,1+rnd()*2.2,1+rnd()*2.2);}g.globalAlpha=1;}

function texAsphalt(){
  const S=512,c=cv(S,S),g=c.getContext('2d');
  g.fillStyle='#22252b';g.fillRect(0,0,S,S);
  speckle(g,S,S,11000,['#171a1f','#2b2f36','#101216','#343841','#0c0e12']);
  for(let i=0;i<18;i++){g.fillStyle=`rgba(${40+rnd()*16|0},${42+rnd()*16|0},${48+rnd()*16|0},.45)`;
    g.beginPath();g.ellipse(rnd()*S,rnd()*S,rr(14,70),rr(10,50),rnd()*PI,0,TAU);g.fill();}
  g.strokeStyle='rgba(10,11,13,.6)';g.lineWidth=1.1;
  for(let i=0;i<30;i++){let x=rnd()*S,y=rnd()*S;g.beginPath();g.moveTo(x,y);
    for(let k=0;k<5;k++){x+=rr(-26,26);y+=rr(-26,26);g.lineTo(x,y);}g.stroke();}
  return CT(c);
}
function texWalk(){
  const S=512,c=cv(S,S),g=c.getContext('2d');
  g.fillStyle='#82807b';g.fillRect(0,0,S,S);
  speckle(g,S,S,7000,['#8e8c87','#77756f','#969490','#6d6b66']);
  g.strokeStyle='rgba(52,50,48,.55)';g.lineWidth=2.5;
  for(let i=0;i<=2;i++){g.beginPath();g.moveTo(i*S/2,0);g.lineTo(i*S/2,S);
    g.moveTo(0,i*S/2);g.lineTo(S,i*S/2);g.stroke();}
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;
  for(let i=0;i<=2;i++){g.beginPath();g.moveTo(i*S/2+2,0);g.lineTo(i*S/2+2,S);
    g.moveTo(0,i*S/2+2);g.lineTo(S,i*S/2+2);g.stroke();}
  for(let i=0;i<10;i++){g.fillStyle='rgba(40,42,46,.2)';
    g.beginPath();g.ellipse(rnd()*S,rnd()*S,rr(16,60),rr(12,40),rnd()*PI,0,TAU);g.fill();}
  return CT(c);
}
function texEarth(){
  const S=256,c=cv(S,S),g=c.getContext('2d');
  g.fillStyle='#33342d';g.fillRect(0,0,S,S);
  speckle(g,S,S,4200,['#3c3e31','#272821','#454136','#1e1f1a']);
  return CT(c);
}
function texGrass(){
  const S=256,c=cv(S,S),g=c.getContext('2d');
  g.fillStyle='#3d5c33';g.fillRect(0,0,S,S);
  speckle(g,S,S,9000,['#47693a','#33512b','#4e7140','#2b4425']);
  for(let i=0;i<12;i++){g.fillStyle='rgba(120,120,70,.16)';
    g.beginPath();g.ellipse(rnd()*S,rnd()*S,rr(10,42),rr(8,32),rnd()*PI,0,TAU);g.fill();}
  return CT(c);
}
function texRoof(){
  const S=256,c=cv(S,S),g=c.getContext('2d');
  g.fillStyle='#43443f';g.fillRect(0,0,S,S);
  speckle(g,S,S,6000,['#4d4e49','#393a36','#55564f','#2e2f2b']);
  g.strokeStyle='rgba(200,200,190,.10)';g.lineWidth=2;
  for(let i=1;i<4;i++){g.beginPath();g.moveTo(i*S/4,0);g.lineTo(i*S/4,S);g.stroke();}
  for(let i=0;i<6;i++){g.fillStyle='rgba(190,190,180,.07)';g.fillRect(rnd()*S,rnd()*S,rr(30,90),rr(20,60));}
  return CT(c);
}
function texShop(){
  const S=256,c=cv(S,S),g=c.getContext('2d'),e=cv(S,S),eg=e.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,S);
  gr.addColorStop(0,'#2c3c48');gr.addColorStop(.5,'#16212b');gr.addColorStop(1,'#0d151c');
  g.fillStyle=gr;g.fillRect(0,0,S,S);
  eg.fillStyle='#000';eg.fillRect(0,0,S,S);
  for(let i=0;i<4;i++){
    const x=i*64;
    g.fillStyle='#20262c';g.fillRect(x,0,5,S);
    if(rnd()<.62){
      const w=rr(24,44),h=rr(40,90),px=x+10,py=rr(120,150);
      const c1=pick(['#ffd9a0','#ffe9c4','#ffcf8a','#cfe6ff','#fff0d0']);
      const rg=g.createLinearGradient(0,py-h,0,py+18);rg.addColorStop(0,c1);rg.addColorStop(1,'#6b4a20');
      g.fillStyle=rg;g.fillRect(px,py-h,w,h+18);
      const re=eg.createLinearGradient(0,py-h,0,py+18);re.addColorStop(0,c1);re.addColorStop(1,'#3a2408');
      eg.fillStyle=re;eg.fillRect(px,py-h,w,h+18);
    }
  }
  g.fillStyle='#1a1f24';g.fillRect(0,58,S,6);
  for(let i=0;i<4;i++){g.fillStyle='rgba(255,255,255,.07)';
    g.beginPath();g.moveTo(i*64+6,S);g.lineTo(i*64+46,64);g.lineTo(i*64+60,64);g.lineTo(i*64+20,S);g.fill();}
  return {map:CT(c),em:CT(e)};
}
function texAwning(){
  const S=128,c=cv(S,S),g=c.getContext('2d');
  const cols=[['#b7362f','#e8ded0'],['#1f5a52','#dfe7dd'],['#2d3a55','#e0dfe2'],['#6b3d7a','#eae0ea']];
  const p=pick(cols),n=6;
  for(let i=0;i<n;i++){g.fillStyle=i%2?p[0]:p[1];g.fillRect(i*S/n,0,S/n,S);}
  speckle(g,S,S,900,['#000'],.06);
  return CT(c);
}
function texFence(){
  const S=128,c=cv(S,S),g=c.getContext('2d');
  g.clearRect(0,0,S,S);
  g.strokeStyle='rgba(168,176,183,.9)';g.lineWidth=2.4;
  for(let i=-S;i<S*2;i+=12){g.beginPath();g.moveTo(i,0);g.lineTo(i+S,S);g.stroke();
    g.beginPath();g.moveTo(i,S);g.lineTo(i+S,0);g.stroke();}
  g.fillStyle='rgba(126,132,138,.95)';g.fillRect(0,0,S,7);g.fillRect(0,S-7,S,7);
  return CT(c);
}
const SIGNS=['CAFÉ','DELI','BLUE MOON','24 H','HOTEL','PIZZA','PHARMA','BOOKS','TAVERN','RAMEN','TACOS',
             'BAR NOIR','STUDIO','NEON','LAUNDRY','BANK'];
function texSigns(){
  const CW=256,CH=128,COLS=4,ROWS=4;
  const c=cv(CW*COLS,CH*ROWS),g=c.getContext('2d');
  const e=cv(CW*COLS,CH*ROWS),eg=e.getContext('2d');
  const pal=['#ff3d7f','#39e6ff','#ffd23d','#7cff6b','#ff7a2f','#c07bff','#ff4b4b','#4bd0ff'];
  for(let i=0;i<COLS*ROWS;i++){
    const x=(i%COLS)*CW,y=((i/COLS)|0)*CH,col=pal[i%pal.length];
    g.fillStyle='#101319';g.fillRect(x,y,CW,CH);
    g.strokeStyle='rgba(255,255,255,.13)';g.lineWidth=4;g.strokeRect(x+7,y+7,CW-14,CH-14);
    const txt=SIGNS[i%SIGNS.length];
    const draw=(ctx,bright)=>{
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=col;
      ctx.shadowBlur=bright?30:16;ctx.fillStyle=col;ctx.font='700 56px "Helvetica Neue",Arial';
      let s=56;while(ctx.measureText(txt).width>CW-38&&s>12){s-=2;ctx.font='700 '+s+'px "Helvetica Neue",Arial';}
      ctx.fillText(txt,x+CW/2,y+CH/2+2);
      ctx.shadowBlur=0;ctx.fillStyle=bright?'#ffffff':'rgba(255,255,255,.92)';
      ctx.fillText(txt,x+CW/2,y+CH/2+2);ctx.restore();
    };
    draw(g,false);draw(eg,true);
  }
  return {map:CT(c),em:CT(e),cols:COLS,rows:ROWS};
}
function texClouds(){
  const W=1024,H=512,c=cv(W,H),g=c.getContext('2d');
  for(let i=0;i<190;i++){
    const x=rnd()*W,y=rr(H*0.05,H*0.75),r=rr(18,95),a=rr(.05,.22);
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(255,255,255,${a})`);rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=rg;g.beginPath();g.ellipse(x,y,r*rr(1.2,2.6),r*rr(.5,.9),0,0,TAU);g.fill();
  }
  return CT(c);
}
const GLASS={gA:'#5f7488',gB:'#232f3b',litA:'#ffd9a2',litB:'#e6ac67',litC:'#3d2a13'};
function makeFacade(cfg){
  const S=320,c=cv(S,S),g=c.getContext('2d'),e=cv(S,S),eg=e.getContext('2d');
  cfg.wall(g,S);
  eg.fillStyle='#000';eg.fillRect(0,0,S,S);
  g.fillStyle='rgba(0,0,0,.20)';g.fillRect(0,S-9,S,9);
  g.fillStyle='rgba(255,255,255,.07)';g.fillRect(0,S-10,S,2);
  const T0=cfg.wy0,T1=cfg.wy1;
  const drawWin=(ctx,x0,y0,x1,y1,glow)=>{
    ctx.fillStyle=cfg.sill||'#20242a';ctx.fillRect(x0-6,y0-6,(x1-x0)+12,(y1-y0)+12);
    const gr=ctx.createLinearGradient(x0,y0,x1,y1);
    gr.addColorStop(0,glow?cfg.litA:cfg.gA);gr.addColorStop(.55,glow?cfg.litB:cfg.gB);
    gr.addColorStop(1,glow?cfg.litC:'#101820');
    ctx.fillStyle=gr;ctx.fillRect(x0,y0,x1-x0,y1-y0);
    if(!glow){ctx.fillStyle='rgba(255,255,255,.10)';ctx.beginPath();
      ctx.moveTo(x0,y1);ctx.lineTo(x0+(x1-x0)*.55,y0);ctx.lineTo(x0+(x1-x0)*.8,y0);
      ctx.lineTo(x0,y1-(y1-y0)*.45);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect((x0+x1)/2-1,y0,2,y1-y0);}
  };
  if(cfg.type==='curtain'){
    const pw=cfg.pw||40;
    for(let x=0;x<S;x+=pw){
      const on=rnd()<cfg.lit;
      drawWin(eg,x+2,T0,x+pw-2,T1,true);
      g.fillStyle=on?pick(['#ffd9a4','#ffeccb','#cfe4ff','#fff2d8']):(rnd()<.35?'#18242c':'#22323d');
      g.fillRect(x+2,T0,pw-4,T1-T0);
      const gr=g.createLinearGradient(0,T0,0,T1);
      gr.addColorStop(0,'rgba(255,255,255,.16)');gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr;g.fillRect(x+2,T0,pw-4,(T1-T0)*.5);
      g.fillStyle=cfg.mull;g.fillRect(x,T0-6,3,S-T0+6);
    }
    g.fillStyle=cfg.spandrel;g.fillRect(0,0,S,T0);g.fillRect(0,T1,S,S-T1);
    speckle(g,S,T0,900,['#000','#fff'],.05);
  }else{
    drawWin(g,cfg.wx0,T0,cfg.wx1,T1,false);
    if(rnd()<cfg.lit){const c2=pick(['#ffd7a0','#ffeccb','#ffcf8f','#c9e2ff']);
      const gr=eg.createLinearGradient(cfg.wx0,T0,cfg.wx1,T1);
      gr.addColorStop(0,c2);gr.addColorStop(1,'#5b3c14');eg.fillStyle=gr;
      eg.fillRect(cfg.wx0,T0,cfg.wx1-cfg.wx0,T1-T0);}
    if(cfg.balcony){
      g.fillStyle='rgba(30,32,36,.85)';g.fillRect(cfg.wx0-14,T1-4,(cfg.wx1-cfg.wx0)+28,7);
      g.strokeStyle='rgba(150,155,160,.55)';g.lineWidth=2;

    this.quad(key,[x0,y0,z0,x0,y0,z1,x0,y1,z1,x0,y1,z0],ou,ov,ou+D,ov+V,o.side||col);

const _c1=new THREE.Color();
let dayT=17.3,daySpeed=1,nightF=0,lampF=0,dayF=1;
const sunDir=new THREE.Vector3(0,1,0);
function applySky(){
  const t=((dayT%24)+24)%24;
  let a=SKY[0],b=SKY[SKY.length-1],f=0;
  for(let i=0;i<SKY.length-1;i++)if(t>=SKY[i].t&&t<=SKY[i+1].t){a=SKY[i];b=SKY[i+1];f=(t-a.t)/(b.t-a.t);break;}
  _c1.copy(a.cTop).lerp(b.cTop,f);skyMat.uniforms.uTop.value.copy(_c1);
  _c1.copy(a.cMid).lerp(b.cMid,f);skyMat.uniforms.uMid.value.copy(_c1);
  _c1.copy(a.cBot).lerp(b.cBot,f);skyMat.uniforms.uBot.value.copy(_c1);
  _c1.copy(a.cSun).lerp(b.cSun,f);skyMat.uniforms.uSunCol.value.copy(_c1);
  sun.color.copy(_c1);
  sun.intensity=lerp(a.sunI,b.sunI,f);
  moonL.intensity=lerp(.03,.26,nightF);
  hemi.intensity=lerp(a.hemiI,b.hemiI,f);
  amb.intensity=lerp(a.ambI,b.ambI,f);
  renderer.toneMappingExposure=lerp(a.exp,b.exp,f);
  _c1.copy(a.cFog).lerp(b.cFog,f);scene.fog.color.copy(_c1);
  scene.fog.density=lerp(.00135,.0019,nightF);
  _c1.copy(a.cCl).lerp(b.cCl,f);clouds.material.color.copy(_c1);
  clouds.material.opacity=lerp(a.clo,b.clo,f);
  skyMat.uniforms.uSunI.value=clamp(sun.intensity/1.2,0,1.4);
  stars.material.opacity=smooth(.06,-.10,sunDir.y)*0.95;
  for(const m of nightMats)m.m.emissiveIntensity=m.b*Math.max(nightF,lampF*0.25);
  for(const m of envMats)m.m.envMapIntensity=m.b*(0.13+0.87*dayF);
}
function updateSun(){
  const ang=(dayT-6)/12*PI;
  sunDir.set(Math.cos(ang),Math.sin(ang),0.32).normalize();
  skyMat.uniforms.uSun.value.copy(sunDir);
  dayF=smooth(-.05,.16,sunDir.y);
  nightF=1-dayF;
  lampF=smooth(.11,-.05,sunDir.y);
  const px=player.pos.x,pz=player.pos.z;
  sun.position.set(px+sunDir.x*300,sunDir.y*300,pz+sunDir.z*300);
  sun.target.position.set(px,0,pz);sun.target.updateMatrixWorld();
  moonL.position.set(px-sunDir.x*180,Math.max(35,-sunDir.y*180),pz-sunDir.z*180);
  moonL.target.position.set(px,0,pz);moonL.target.updateMatrixWorld();
  moon.position.set(camera.position.x-sunDir.x*1250,-sunDir.y*1250,camera.position.z-sunDir.z*1250);
  moon.material.color.setRGB(.88,.92,1).multiplyScalar(clamp(.25+nightF*1.5,.25,1.4));
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  clouds.position.copy(camera.position);clouds.rotation.y+=0.00002;
  applySky();
}

function subdivide(r,depth,minW,out){
  const w=r.e.x-r.s.x,d=r.e.z-r.s.z;
  if(depth<=0||(w<minW*2&&d<minW*2)||rnd()<0.16){out.push(r);return;}
  const longAxis=w>=d,size=longAxis?w:d;
  if(size<minW*2.2){out.push(r);return;}
  const cut=size*(0.38+rnd()*0.24);
  if(longAxis){
    out.push({s:{x:r.s.x,z:r.s.z},e:{x:r.s.x+cut,z:r.e.z}});
    subdivide({s:{x:r.s.x+cut,z:r.s.z},e:r.e},depth-1,minW,out);
  }else{
    out.push({s:{x:r.s.x,z:r.s.z},e:{x:r.e.x,z:r.s.z+cut}});
    subdivide({s:{x:r.s.x,z:r.s.z+cut},e:r.e},depth-1,minW,out);
  }
}
function buildBlock(i,j){
  const cx=cb(i),cz=cb(j),dist=Math.max(Math.abs(cx),Math.abs(cz))/HALF,core=1-dist;
  const roll=rnd();
  if(roll<(dist>0.42?0.16:0.06)){buildPark(cx,cz);return;}
  if(roll<(dist>0.42?0.21:0.10)){buildLot(cx,cz);return;}
  blockInfo.push({x:cx,z:cz,t:core>0.6?2:1});
  const rects=[];
  subdivide({s:{x:cx-BLOCK/2+7.6,z:cz-BLOCK/2+7.6},e:{x:cx+BLOCK/2-7.6,z:cz+BLOCK/2-7.6}},
    core>0.6?2:3, core>0.62?19:(core>0.34?13:10), rects);
  const pool=core>0.6?DOWNTOWN:(core>0.34?MIDTOWN:UPTOWN);
  for(const q of rects){
    let w=q.e.x-q.s.x,d=q.e.z-q.s.z;
    if(w<6||d<6)continue;
    let px=(q.s.x+q.e.x)/2,pz=(q.s.z+q.e.z)/2;
    const sx=chance(.3)?rr(0.8,2.6):0, sz=chance(.3)?rr(0.8,2.6):0;
    w-=1.0+sx;d-=1.0+sz;
    if(sx)px+=(rnd()<.5?-1:1)*sx/2;
    if(sz)pz+=(rnd()<.5?-1:1)*sz/2;
    if(w<5||d<5)continue;
    const h=core>0.62?floors(rr(38,104)*(chance(.14)?1.5:1))
             :(core>0.34?floors(rr(13,44)):floors(rr(6.5,17)));
    const style=pick(pool),tint=pick(TINTS);
    if(w*d>420&&h>30){
      const h1=floors(h*rr(0.35,0.55));
      addBuilding(px,pz,w,d,h1,style,tint);
      const ww=w*rr(0.55,0.8),dd=d*rr(0.55,0.8);
      addBuilding(px+(rnd()-.5)*(w-ww)*0.5, pz+(rnd()-.5)*(d-dd)*0.5,
                  ww,dd,h-h1,style,pick(TINTS));
    }else addBuilding(px,pz,w,d,h,style,tint);
  }
}

function startTurn(c,side,target){

  const nodeX=c.axis===0?rc(target):rc(c.road);
  const nodeZ=c.axis===0?rc(c.road):rc(target);
  const endX=nAxis===0?nodeX+nDir*8:nodeX-nDir*LANE;
  const endZ=nAxis===0?nodeZ+nDir*LANE:nodeZ+nDir*8;
  const sx=c.x,sz=c.z,ctrX=nodeX+f.x*1.2,ctrZ=nodeZ+f.z*1.2;
  const wp=[];

}
function endTurn(c){

function driveCar(c,dt){

function updateCars(dt){
  for(let i=0;i<cars.length;i++){
    const c=cars[i];
    if(c.parked)continue;
    if(driving.car===c)continue;
    if(c.turning){
      const w=c.wp[Math.min(c.wpi,c.wp.length-1)];
      c.tx=w.x;c.tz=w.z;
      if(Math.hypot(w.x-c.x,w.z-c.z)<3.6){c.wpi++;if(c.wpi>=c.wp.length)endTurn(c);}
      c.speed+=clamp(Math.min(c.speed,6.4)-c.speed,-9,3)*Math.min(1,dt*2.4);
    }else{
      const u=(c.m+HALF)/PITCH;
      let target=c.dir>0?Math.floor(u)+1:Math.ceil(u)-1;
      if(target<0||target>GRID){
        c.dir*=-1;c.heading+=PI;c.lane=laneOf(c.axis,c.road,c.dir);
        target=clamp(c.dir>0?Math.floor(u)+1:Math.ceil(u)-1,0,GRID);
      }
      c.lane=laneOf(c.axis,c.road,c.dir);
      const nodeX=c.axis===0?rc(target):rc(c.road),nodeZ=c.axis===0?rc(c.road):rc(target);
      const along=(rc(target)-c.m)*c.dir;
      if(c.lastTarget!==target){c.lastTarget=target;c.decided=false;}
      const stt=lightState(c.axis===0?target:c.road,c.axis===0?c.road:target,c.axis);
      let want=c.maxS;
      const dStop=along-(ROAD/2+1.4);
      if(stt!=='g'&&dStop>-0.4)want=(stt==='a'&&dStop>9)?c.maxS:Math.max(0,dStop*1.4);
      for(let n=0;n<cars.length;n++){
        if(n===i||cars[n].parked)continue;
        const o=cars[n],dx=o.x-c.x,dz=o.z-c.z;
        if(dx*dx+dz*dz>120)continue;
        const fx=Math.sin(c.heading),fz=Math.cos(c.heading);
        const la=dx*fx+dz*fz;
        if(la>0.4&&la<8.6&&Math.abs(-dx*fz+dz*fx)<2.6)want=Math.min(want,Math.max(0,la-6.0));
      }
      for(let n=0;n<PEDS;n++){
        const p=peds[n],dx=p.x-c.x,dz=p.z-c.z;
        if(dx*dx+dz*dz>110)continue;
        const fx=Math.sin(c.heading),fz=Math.cos(c.heading);
        const la=dx*fx+dz*fz;
        if(la>0&&la<9.5&&Math.abs(-dx*fz+dz*fx)<3.2)want=Math.min(want,Math.max(0,(la-4)*1.1));
      }
      if(!c.decided&&along<3.2&&along>0.2&&stt==='g'){
        c.decided=true;const r=rnd();

        if(r<0.40){startTurn(c,'L',target);continue;}
      }
      c.tx=nodeX;c.tz=nodeZ;
      c.speed+=clamp(want-c.speed,-8,5.5)*Math.min(1,dt*2.6);
    }
    c.speed=clamp(c.speed,0,16);
    const want=Math.atan2(c.tx-c.x,c.tz-c.z);
    const diff=((want-c.heading+PI*3)%TAU)-PI;
    c.heading+=clamp(diff,-1,1)*Math.min(1,dt*3.4)*(0.4+0.6*clamp(c.speed/6,0,1));
    const nx=c.x+Math.sin(c.heading)*c.speed*dt,nz=c.z+Math.cos(c.heading)*c.speed*dt;
    let blocked=false;
    for(const b of nearColliders(nx,nz))
      if(b.y>0.6&&nx>b.x0-1&&nx<b.x1+1&&nz>b.z0-1&&nz<b.z1+1){blocked=true;break;}
    if(!blocked&&nx>-HALF-ROAD&&nx<HALF+ROAD&&nz>-HALF-ROAD&&nz<HALF+ROAD){c.x=nx;c.z=nz;}
    else c.speed*=0.22;

  }
}

function updatePlayer(dt){

  const el=$('clock');
  el.children[0].textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  const phase=h<5?'night':h<7?'dawn':h<11?'morning':h<16?'midday':h<19?'golden hour':h<21?'dusk':'night';
  el.children[1].textContent=DAYS[dayIdx]+' · '+phase;
}
function drawMap(){
  const W=mapC.width,R=W/2,s=2.55;
  mx.setTransform(1,0,0,1,0,0);mx.clearRect(0,0,W,W);
  mx.save();mx.beginPath();mx.arc(R,R,R-1,0,TAU);mx.clip();
  mx.fillStyle='#0a0f16';mx.fillRect(0,0,W,W);
  mx.translate(R,R);mx.rotate(camYaw);
  const px=player.pos.x,pz=player.pos.z;
  mx.strokeStyle='#1e2732';mx.lineWidth=ROAD*s;
  for(let k=0;k<=GRID;k++){
    mx.beginPath();mx.moveTo((rc(k)-px)*s,(-HALF-8-pz)*s);mx.lineTo((rc(k)-px)*s,(HALF+8-pz)*s);mx.stroke();
    mx.beginPath();mx.moveTo((-HALF-8-px)*s,(rc(k)-pz)*s);mx.lineTo((HALF+8-px)*s,(rc(k)-pz)*s);mx.stroke();
  }
  for(const b of blockInfo){
    const x=(b.x-px)*s,z=(b.z-pz)*s,r=BLOCK*s/2;
    if(Math.abs(x)>R+r||Math.abs(z)>R+r)continue;
    mx.fillStyle=b.t===0?'#1c3427':(b.t===2?'#2b333f':(b.t===3?'#241f1c':'#252d37'));
    mx.fillRect(x-r,z-r,r*2,r*2);
  }
  mx.fillStyle='#f0d68a';
  for(const c of cars){
    if(c.parked)continue;
    const x=(c.x-px)*s,z=(c.z-pz)*s;
    if(x*x+z*z>(R-6)*(R-6))continue;
    mx.fillRect(x-1.6,z-1.6,3.2,3.2);
  }
  mx.fillStyle='rgba(220,230,245,.5)';
  for(const p of peds){
    const x=(p.x-px)*s,z=(p.z-pz)*s;
    if(x*x+z*z>(R-6)*(R-6))continue;
    mx.fillRect(x-0.9,z-0.9,1.8,1.8);
  }
  mx.restore();
  mx.save();mx.translate(R,R);
  mx.save();mx.rotate(-camYaw);
  mx.fillStyle='rgba(255,255,255,.42)';mx.font='600 13px "Helvetica Neue",Arial';
  mx.textAlign='center';mx.textBaseline='middle';mx.fillText('N',0,-R+15);
  mx.restore();
  mx.fillStyle='#fff';mx.beginPath();
  mx.moveTo(0,-11);mx.lineTo(7.5,9);mx.lineTo(0,4.5);mx.lineTo(-7.5,9);mx.closePath();mx.fill();
  mx.strokeStyle='rgba(0,0,0,.6)';mx.lineWidth=1.5;mx.stroke();
  mx.restore();
}

/* ============================================================
   14 · ambience
   ============================================================ */
let actx,gainNode,audioOn=true,audioReady=false;
function startAudio(){
  if(audioReady)return;audioReady=true;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const len=actx.sampleRate*3,buf=actx.createBuffer(1,len,actx.sampleRate),ch=buf.getChannelData(0);
    let lv=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;lv=(lv+0.02*w)/1.02;ch[i]=lv*3.2;}
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=340;
    const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=45;
    gainNode=actx.createGain();gainNode.gain.value=0;
    src.connect(lp).connect(hp).connect(gainNode).connect(actx.destination);src.start();
    const wsrc=actx.createBufferSource();wsrc.buffer=buf;wsrc.loop=true;
    const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1400;bp.Q.value=.4;
    const wg=actx.createGain();wg.gain.value=0.05;
    wsrc.connect(bp).connect(wg).connect(gainNode);wsrc.start();
    gainNode.gain.linearRampToValueAtTime(audioOn?0.16:0,actx.currentTime+2.5);
  }catch(e){}
}
function updateAudio(){
  if(!audioReady||!gainNode)return;
  let near=0;
  for(const c of cars){
    if(c.parked)continue;
    const d=Math.hypot(c.x-player.pos.x,c.z-player.pos.z);
    if(d<60)near+=(1-d/60)*(0.35+c.speed/22);
  }
  gainNode.gain.value=lerp(gainNode.gain.value,audioOn?clamp(0.05+near*0.1,0,0.3):0,0.05);
}

/* ============================================================
   15 · boot + loop
   ============================================================ */
let ready=false,simTime=0,frame=0;
const DAY_SECONDS=210;
function prog(f,t){$('load').firstElementChild.style.width=(f*100).toFixed(0)+'%';$('st').textContent=t;}
async function boot(){
  try{
    prog(0.05,'mixing materials');await raf();
    buildMaterials();
    prog(0.17,'raising the sky');await raf();
    buildSky();
    prog(0.22,'spawning you');await raf();
    buildPlayer();
    prog(0.26,'paving streets');await raf();
    buildGround();buildSidewalks();
    prog(0.34,'zoning blocks');await raf();
    for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++){
      buildBlock(i,j);
      const n=i*GRID+j;
      if(n%14===0){prog(0.34+0.33*(n/(GRID*GRID)),'erecting buildings');await raf();}
    }
    prog(0.7,'streetscape furniture');await raf();
    buildFurniture();
    prog(0.79,'merging geometry');await raf();
    M.build(cityG,k=>MAT[k]||MAT.stone,true,true);
    prog(0.87,'spawning traffic');await raf();
    buildCars();buildPeds();
    prog(0.95,'checking the sun');await raf();
    updatePeds(0.016);
    updateSun();
    updateCamera(0.016);
    syncCarInstances();
    renderer.compile(scene,camera);
    prog(1,'ready');
    ready=true;
    $('keyrow').style.opacity=1;$('go').classList.add('on');
    loop();
  }catch(err){
    console.error(err);
    const e=$('err');e.style.display='grid';
    e.innerHTML='<div><b>the city failed to compile</b><br><br>'+String(err&&err.stack||err)
      +'<br><br>needs WebGL2 + access to the three.js CDN</div>';
    gate.style.display='none';
  }
}
let last=performance.now(),fpsAcc=0,fpsN=0,perfChecked=false;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  let dt=(now-last)/1000;last=now;
  dtGlob=dt=Math.min(dt,0.05);
  simTime+=dt;frame++;
  const prev=dayT;
  dayT+=dt*(24/DAY_SECONDS)*daySpeed;
  if(Math.floor(dayT/24)!==Math.floor(prev/24))dayIdx=(dayIdx+1)%7;
  updateCars(dt);
  updatePlayer(dt);
  updatePeds(dt);
  updateSun();
  updateCamera(dt);
  syncCarInstances();
  renderer.shadowMap.needsUpdate=(frame%2===0);
  drawMap();
  hud();
  updateAudio();
  composer.render();
  if(!perfChecked){
    fpsAcc+=1/dt;fpsN++;
    if(fpsN===110){
      perfChecked=true;
      if(fpsAcc/fpsN<32){
        renderer.setPixelRatio(1);bloom.strength=0.32;
        renderer.shadowMap.enabled=false;
        scene.traverse(o=>{if(o.isMesh&&o.material)
          (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);});
        toast('perf mode engaged');
      }
    }
  }
}
addEventListener('error',ev=>{
  if(!ready)return;
  const e=$('err');e.style.display='grid';
  e.innerHTML='<div><b>runtime error</b><br><br>'+String(ev.message)+'</div>';
});
boot();
</script>
